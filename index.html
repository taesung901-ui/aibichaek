<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김태성의 책</title>
    <style>
        :root {
            --bg: #f5f2ec;
            --paper: #fffdf8;
            --ink: #242424;
            --muted: #66625d;
            --line: #ded6c9;
            --blue: #24384f;
            --blue-hover: #314d6d;
            --soft: #ede7dc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            line-height: 1.6;
        }

        .page {
            width: min(1080px, calc(100% - 40px));
            margin: 0 auto;
            padding: 56px 0 64px;
        }

        header {
            margin-bottom: 34px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 22px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            letter-spacing: 0;
        }

        .intro {
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 26px;
        }

        .book {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 24px;
            align-items: start;
            padding: 24px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .cover {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
            background: var(--soft);
        }

        h2 {
            margin: 2px 0 8px;
            font-size: 1.35rem;
            line-height: 1.3;
            letter-spacing: 0;
        }

        .subtitle {
            margin: 0 0 12px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .author {
            margin: 0 0 22px;
            font-size: 0.92rem;
            color: var(--muted);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.92rem;
        }

        .primary {
            background: var(--blue);
            color: white;
        }

        .primary:hover {
            background: var(--blue-hover);
        }

        .secondary {
            background: var(--soft);
            color: var(--ink);
            border: 1px solid var(--line);
        }

        .secondary:hover {
            background: #e3dccf;
        }

        footer {
            margin-top: 36px;
            color: var(--muted);
            font-size: 0.86rem;
        }

        @media (max-width: 880px) {
            .books {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 560px) {
            .page {
                width: min(100% - 28px, 1080px);
                padding-top: 34px;
            }

            .book {
                grid-template-columns: 118px 1fr;
                gap: 16px;
                padding: 16px;
            }

            h2 {
                font-size: 1.08rem;
            }

            .subtitle,
            .author,
            .btn {
                font-size: 0.86rem;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header>
            <h1>김태성의 책</h1>
            <p class="intro">직접 쓰고 다듬은 PDF 책을 모아둔 작은 책장입니다.</p>
        </header>

        <section class="books" aria-label="책 목록">
            <article class="book">
                <img src="aijeongdok-cover.png" alt="AI 정독 표지" class="cover">
                <div>
                    <h2>AI 정독</h2>
                    <p class="subtitle">가중치에서 프롬프트 인젝션까지</p>
                    <p class="author">저자 김태성</p>
                    <div class="actions">
                        <a href="aijeongdok.pdf" target="_blank" class="btn primary">웹에서 바로 읽기</a>
                        <a href="aijeongdok.pdf" download class="btn secondary">PDF 저장하기</a>
                    </div>
                </div>
            </article>

            <article class="book">
                <img src="cover.png" alt="AI 비책 표지" class="cover">
                <div>
                    <h2>AI 비책</h2>
                    <p class="subtitle">기술 책임자가 AI를 읽고, 묻고, 판단하는 법</p>
                    <p class="author">저자 김태성</p>
                    <div class="actions">
                        <a href="aibichaek-book-gowun_taesung.pdf" target="_blank" class="btn primary">웹에서 바로 읽기</a>
                        <a href="aibichaek-book-gowun_taesung.pdf" download class="btn secondary">PDF 저장하기</a>
                    </div>
                </div>
            </article>

            <article class="book">
                <img src="saenggagi-cover.png" alt="생각이 굳기 전에 표지" class="cover">
                <div>
                    <h2>생각이 굳기 전에</h2>
                    <p class="subtitle">너에게 남기고, 나도 다시 배우는 말들</p>
                    <p class="author">저자 김태성</p>
                    <div class="actions">
                        <a href="saenggagi-before.pdf" target="_blank" class="btn primary">웹에서 바로 읽기</a>
                        <a href="saenggagi-before.pdf" download class="btn secondary">PDF 저장하기</a>
                    </div>
                </div>
            </article>
        </section>

    </main>
</body>
</html>
